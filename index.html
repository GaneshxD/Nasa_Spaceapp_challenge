<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orbit Ranger: design a satellite that spots wildfires</title>
  <meta name="description" content="A 3D space mission game with levels: meet the rocket, build it, fly it to space, reach orbit, then design your own wildfire-watching satellite with real NASA fire data.">
  <meta name="theme-color" content="#58cc02">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/designer.css">
  <link rel="stylesheet" href="css/levels.css">
  <link rel="stylesheet" href="css/play.css">
  <link rel="stylesheet" href="css/team.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-screen="title">
  <canvas id="stage" tabindex="0" aria-label="3D view. Drag to look around, scroll to zoom. Arrow keys also turn the view."></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header id="topbar">
    <button class="brand" type="button" data-act="home" aria-label="Orbit Ranger, back to the start">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="9" fill="#2563C9"/><path d="M13 18c3-4 9-5 13-1-2 1-3 4-6 4s-4-2-7-3z" fill="#128A5E"/><ellipse cx="20" cy="20" rx="17" ry="7" fill="none" stroke="#fff" stroke-width="2.2" transform="rotate(-28 20 20)"/><circle cx="34.4" cy="12.4" r="3.4" fill="#F2542D"/></svg>
      <span>Orbit Ranger</span>
    </button>
    <nav id="rail" aria-label="Design steps"></nav>
    <div class="tools">
      <button type="button" class="tool" data-act="sound" id="sound-btn" aria-pressed="true">Sound on</button>
      <button type="button" class="tool" data-act="sources">NASA data</button>
      <button type="button" class="tool" data-act="help">How to play</button>
    </div>
  </header>

  <div id="viewtabs" role="group" aria-label="What the 3D view shows"></div>
  <p id="caption"></p>
  <aside id="gauges" aria-label="Mission resources"></aside>
  <main id="panel"></main>
  <div id="levels"></div>
  <section id="hud" aria-label="Mission control"></section>
  <div id="count" aria-hidden="true"></div>
  <div id="fade" aria-hidden="true"></div>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <div id="dialog-body"></div>
  </dialog>
  <div id="live" class="vh" aria-live="polite"></div>

  <noscript><p class="noscript">Orbit Ranger needs JavaScript switched on.</p></noscript>

  <!-- Plain scripts (no modules) so the game runs straight from a double-click on this file. -->
  <script src="vendor/three.min.js"></script>
  <script src="assets/textures.js"></script>
  <script src="assets/nasa-fires.js"></script>
  <!-- core: the simulation. No browser code, so it also runs in Node (tests, tools, server). -->
  <script src="js/core/data.js"></script>
  <script src="js/core/physics.js"></script>
  <script src="js/core/model.js"></script>
  <script src="js/core/sim.js"></script>
  <script src="js/core/flight.js"></script>
  <!-- scene: everything drawn in 3D -->
  <script src="js/scene/engine.js"></script>
  <script src="js/scene/earth.js"></script>
  <script src="js/scene/satellite.js"></script>
  <script src="js/scene/rocket.js"></script>
  <script src="js/scene/views.js"></script>
  <!-- ui: shared pieces, then the levels, then the mission designer -->
  <script src="js/ui/audio.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/drag.js"></script>
  <script src="js/ui/replay.js"></script>
  <script src="js/ui/widgets.js"></script>
  <script src="js/ui/progress.js"></script>
  <!-- net: optional team play on separate devices; idle when there is no server -->
  <script src="js/net/room.js"></script>
  <script src="js/ui/rewards.js"></script>
  <script src="js/ui/levels/kit.js"></script>
  <script src="js/ui/levels/map.js"></script>
  <script src="js/ui/levels/level1.js"></script>
  <script src="js/ui/levels/level2.js"></script>
  <script src="js/ui/levels/level3.js"></script>
  <script src="js/ui/levels/level4.js"></script>
  <script src="js/ui/levels/index.js"></script>
  <script src="js/ui/designer/context.js"></script>
  <script src="js/ui/designer/screens.js"></script>
  <script src="js/ui/designer/step.js"></script>
  <script src="js/ui/designer/review.js"></script>
  <script src="js/ui/designer/report.js"></script>
  <script src="js/ui/designer/dialogs.js"></script>
  <script src="js/ui/designer/mission.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
